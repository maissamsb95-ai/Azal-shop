
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تتبّع طلبك | AZAL SHOP</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(150deg,#fdf0f7,#edf4ff);
  font-family:Tahoma,Arial,sans-serif;
  color:#153a63;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.card{
  background:white;
  border-radius:24px;
  padding:30px 22px;
  width:100%;
  max-width:440px;
  box-shadow:0 12px 40px #153a6317;
  text-align:center;
}
.logo{font-size:27px;font-weight:bold}
.subtitle{color:#8c6483;font-size:14px}
h2{font-size:22px}
input{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:12px;
  margin:12px 0;
}
button,.back{
  display:inline-block;
  background:#153a63;
  color:white;
  border:0;
  border-radius:12px;
  padding:13px 22px;
  cursor:pointer;
  font-size:15px;
  text-decoration:none;
}
button:disabled{opacity:.5}
#result{margin:22px 0;text-align:right}
.step{
  padding:14px;
  margin:10px 0;
  background:#f3f5f9;
  border-radius:12px;
  color:#8b94a5;
}
.step.done{
  background:#e5f6ee;
  color:#237552;
}
.step.current{
  background:#fff0f7;
  color:#b52e72;
  font-weight:bold;
}
.error{color:#ba3154;text-align:center}
</style>
</head>
<body>
<div class="card">
  <div class="logo">AZAL SHOP 🦋</div>
  <p class="subtitle">Your style, your Azal</p>
  <h2>تتبّعي طلبك 💗</h2>
  <p>اعرفي وين وصل طلبك بكل سهولة</p>

  <input id="token" placeholder="رمز التتبّع الخاص بطلبك">
  <button id="checkBtn" onclick="trackOrder()">تتبّع الطلب</button>

  <div id="result" role="status" aria-live="polite"></div>

  <a class="back" href="index.html">العودة للمتجر</a>
</div>

<script>
const sb = supabase.createClient(
  "https://dyycupydbyqfpugtpwoa.supabase.co",
  "sb_publishable_hYQzWO6VYm_DI_lamIPtAA_Q0fU967k"
);

const steps = [
  ["new","تم استلام الطلب"],
  ["confirmed","تم تأكيد الطلب"],
  ["preparing","جاري تجهيز الطلب"],
  ["shipped","الطلب في الطريق"],
  ["completed","تم تسليم الطلب"]
];

const params = new URLSearchParams(location.search);
const tokenFromLink = params.get("token");

if(tokenFromLink){
  document.getElementById("token").value = tokenFromLink;
  trackOrder();
}

async function trackOrder(){
  const token = document.getElementById("token").value.trim();
  const box = document.getElementById("result");
  const button = document.getElementById("checkBtn");

  if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(token)){
    box.innerHTML = '<p class="error">رمز التتبّع غير صحيح.</p>';
    return;
  }

  box.textContent = "جاري البحث عن طلبك...";
  button.disabled = true;

  try {
    const {data,error} = await sb.rpc("azal_track_order",{
      p_token:token
    });

    if(error) throw error;

    if(!data || !data.length){
      box.innerHTML = '<p class="error">لم نجد طلبًا بهذا الرمز.</p>';
      return;
    }

    const order = data[0];

    if(order.order_status === "cancelled"){
      box.innerHTML =
        '<p class="error">تم إلغاء هذا الطلب. تواصلي مع المتجر للاستفسار.</p>';
      return;
    }

    const current = steps.findIndex(
      s => s[0] === order.order_status
    );

    if(current === -1){
      box.textContent = "حالة الطلب غير متاحة حاليًا.";
      return;
    }

    box.replaceChildren();

    const heading = document.createElement("h3");
    heading.textContent = "الطلب #" + order.order_id;
    box.appendChild(heading);

    steps.forEach((step,index)=>{
      const item = document.createElement("div");
      item.className = "step" +
        (index < current ? " done" :
        index === current ? " current" : "");

      item.textContent =
        (index <= current ? "✓ " : "○ ") + step[1];

      box.appendChild(item);
    });

  }catch(error){
    console.error(error);
    box.innerHTML =
      '<p class="error">تعذّر جلب حالة الطلب، حاولي لاحقًا.</p>';
  }finally{
    button.disabled = false;
  }
}
</script>
  
<!-- AZAL ORDER REVIEWS -->
<style>
#azalReviewBox{
  margin:24px 0 12px;
  padding:20px 15px;
  border:1px solid #f3c6db;
  border-radius:18px;
  background:#fff7fb;
  text-align:center;
}
#azalReviewBox[hidden],
#azalReviewForm[hidden]{display:none!important}
.azalStars{
  display:flex;
  justify-content:center;
  gap:5px;
  direction:ltr;
  margin:14px 0;
}
.azalStars button{
  background:transparent;
  color:#bec5d0;
  padding:3px;
  font-size:35px;
  line-height:1;
  border:0;
}
.azalStars button.active{color:#edb33e}
#azalReviewBox textarea{
  display:block;
  width:100%;
  min-height:95px;
  padding:12px;
  border:1px solid #e8cddd;
  border-radius:12px;
  resize:vertical;
  font:14px Tahoma,Arial,sans-serif;
  margin:12px 0;
}
#azalReviewMessage{font-size:14px}
</style>

<div id="azalReviewBox" hidden>
  <h3>قيّمي تجربتك مع أزل 🦋</h3>
  <p>رأيك بيساعدنا نكون أفضل!</p>

  <div id="azalReviewForm">
    <div class="azalStars" id="azalStars"></div>

    <textarea id="azalReviewComment"
      maxlength="1000"
      placeholder="احكيلنا رأيك بالمنتجات والتوصيل..."></textarea>

    <button id="azalSendReview" type="button">
      إرسال التقييم 💗
    </button>
  </div>

  <p id="azalReviewMessage" role="status"></p>
</div>

<script>
(function(){
  const box=document.getElementById("azalReviewBox");
  const form=document.getElementById("azalReviewForm");
  const stars=document.getElementById("azalStars");
  const message=document.getElementById("azalReviewMessage");
  const send=document.getElementById("azalSendReview");
  const input=document.getElementById("token");

  let rating=0;
  let requestNumber=0;

  for(let i=1;i<=5;i++){
    const star=document.createElement("button");
    star.type="button";
    star.textContent="★";
    star.setAttribute("aria-label",i+" نجوم");

    star.onclick=()=>{
      rating=i;
      [...stars.children].forEach((el,index)=>{
        el.classList.toggle("active",index<i);
      });
    };

    stars.appendChild(star);
  }

  async function showReview(){
    const current=++requestNumber;
    const token=input.value.trim();
    box.hidden=true;
    message.textContent="";

    if(!/^[0-9a-f-]{36}$/i.test(token))return;

    try{
      const {data,error}=await sb.rpc(
        "azal_track_order",{p_token:token}
      );

      if(error||!data||!data.length)return;
      if(current!==requestNumber)return;
      if(data[0].order_status!=="completed")return;

      const result=await sb.rpc(
        "azal_review_status",{p_token:token}
      );

      if(result.error)throw result.error;
      if(current!==requestNumber)return;

      box.hidden=false;
      form.hidden=Boolean(result.data);

      if(result.data){
        message.textContent=
          "شكرًا إلك! تم تسجيل تقييم لهذا الطلب مسبقًا 💗";
      }
    }catch(error){
      console.error("AZAL review:",error);
    }
  }

  send.onclick=async()=>{
    if(!rating){
      message.textContent="اختاري عدد النجوم أولًا";
      return;
    }

    send.disabled=true;
    message.textContent="جاري إرسال التقييم...";

    const token=input.value.trim();
    const comment=document.getElementById(
      "azalReviewComment"
    ).value.trim();

    try{
      const {data,error}=await sb.rpc(
        "azal_submit_review",{
          p_token:token,
          p_rating:rating,
          p_comment:comment
        }
      );

      if(error)throw error;

      if(data==="success"){
        form.hidden=true;
        message.textContent=
          "تم إرسال تقييمك بنجاح! شكرًا من أزل 🦋";
      }else if(data==="already_reviewed"){
        form.hidden=true;
        message.textContent="تم تقييم هذا الطلب مسبقًا.";
      }else{
        message.textContent=
          "تعذر إرسال التقييم. تأكدي أن الطلب مكتمل.";
      }
    }catch(error){
      console.error(error);
      message.textContent=
        "حدث خطأ، حاولي مرة ثانية.";
    }finally{
      send.disabled=false;
    }
  };

  document.getElementById("checkBtn")
    .addEventListener("click",showReview);

  if(input.value.trim())showReview();
})();
</script>
<!-- END AZAL ORDER REVIEWS -->

</body>
</html>
